<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SaaS Dashboard</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

<div class="app-container">

  <!-- SIDEBAR -->
  <aside class="sidebar">
    <h2 class="logo">Analytics</h2>

    <nav class="nav">
      <a href="#">Dashboard</a>
      <a href="#">Analytics</a>
      <a href="#">Projects</a>
      <a href="#">Settings</a>
    </nav>
  </aside>

  <!-- HEADER -->
  <header class="header">
    <input type="text" placeholder="Search..." class="search">
     
    <div class="user">Isha Mondal</div>
  </header>

  <!-- MAIN CONTENT -->
  <main class="main">
    <h1>Dashboard Overview</h1>
<div class="cards">

  <div class="metric-card">
    <p class="metric-title">Total Users</p>
    <h2 class="metric-value">12,430</h2>
    <span class="metric-growth">+12% this month</span>
  </div>

  <div class="metric-card">
    <p class="metric-title">Revenue</p>
    <h2 class="metric-value">$8,420</h2>
    <span class="metric-growth">+7% growth</span>
  </div>

  <div class="metric-card">
    <p class="metric-title">Orders</p>
    <h2 class="metric-value">1,284</h2>
    <span class="metric-growth">+5% increase</span>
  </div>

  <div class="metric-card">
    <p class="metric-title">Active Users</p>
    <h2 class="metric-value">3,921</h2>
    <span class="metric-growth">+18% engagement</span>
  </div>

</div>
   
    
<div class="chart-container">
  <canvas id="revenueChart"></canvas>
</div>
<div class="table-controls">
  
  
<button id="filter-toggle">Select Status ▼</button>
  <div id="filter-box" class="filter-box">
    <p data-status="all">All</p>
    <p data-status="Active">Active</p>
    <p data-status="Pending">Pending</p>
    <p data-status="Churned">Churned</p>
  </div>

</div>
  <table class="data-table">
    <thead>
      <tr>
        <th>ID</th>
        <th>User Name</th>
        <th>Email</th>
        <th>Revenue</th>
        <th>Status</th>
      </tr>
    </thead>
    <tbody id="table-body"></tbody>
  </table>
</div>
    
  </main>

</div>
 <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<script type="module" src="./js/app.js"></script>
</body>
</html>
