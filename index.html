<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>SaaS Analytics Dashboard</title>

<link rel="stylesheet" href="css/style.css">

</head>

<body>

<div class="app-container">

<!-- SIDEBAR -->

<aside class="sidebar">

<h2 class="logo">Analytics</h2>

<nav class="nav-menu">
<a href="#">Dashboard</a>
<a href="#">Analytics</a>
<a href="#">Projects</a>
<a href="#">Settings</a>
</nav>

</aside>

<!-- MAIN AREA -->

<div class="main-area">

<!-- HEADER -->

<header class="top-header">

<input type="text" placeholder="Search..." class="search">

<div class="user">M.Isha</div>

</header>

<!-- MAIN CONTENT -->

<main class="content">

<h1>Dashboard Overview</h1>

<div class="cards">

<div class="metric-card">

<p class="metric-title">Total Users</p>
<h2 class="metric-value">12,430</h2>
<span class="metric-growth">+12% this month</span>

</div>

<div class="metric-card">

<p class="metric-title">Revenue</p>
<h2 class="metric-value">$8,420</h2>
<span class="metric-growth">+7% growth</span>

</div>

<div class="metric-card">

<p class="metric-title">Orders</p>
<h2 class="metric-value">1,284</h2>
<span class="metric-growth">+5% increase</span>

</div>

<div class="metric-card">

<p class="metric-title">Active Users</p>
<h2 class="metric-value">3,921</h2>
<span class="metric-growth">+18% engagement</span>

</div>

</div>

  <!-- ✅ CHART (INSIDE MAIN) -->
<section class="container">
  <h2>Top 10 Revenue Contributors</h2>

  <div class="chart-container">
    <canvas id="revenueChart"></canvas>
  </div>
</section>
  
<div class="table-container">
  <table class="data-table">
    <thead>
      <tr>
        <th>ID</th>
        <th>User Name</th>
        <th>Email</th>
        <th>Revenue</th>
        <th>Status</th>
      </tr>
    </thead>
    <tbody id="table-body"></tbody>
  </table>
</div>
  
</main>

</div>

</div>


<!-- ✅ Chart.js CDN -->
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>




<!-- Then logic -->
<script type="module" src="js/app.js"></script>
</body>

</html>
